2 0h2M3 29.5h1m5 0h1m5 0h2m1 0h1m1 0h2m5 0h1m3 0h2m1 0h3M2 30.5h2m4 0h1m1 0h2m3 0h5m1 0h1m1 0h2m1 0h1m1 0h1m1 0h2m2 0h1m6 0h1M3 31.5h1m6 0h2m2 0h1m2 0h2m3 0h1m2 0h1m2 0h2m3 0h1m1 0h1m4 0h3M2 32.5h1m1 0h2m1 0h3m5 0h2m1 0h1m1 0h2m3 0h4m2 0h1m1 0h2m2 0h2m2 0h2M6 33.5h1m2 0h1m4 0h1m1 0h4m1 0h1m3 0h3m1 0h7m3 0h1m2 0h1M2 34.5h1m1 0h2m2 0h1m2 0h3m6 0h1m2 0h3m7 0h6m1 0h1m1 0h1M10 35.5h1m2 0h1m1 0h1m1 0h1m5 0h3m1 0h1m2 0h1m3 0h1m3 0h1m1 0h3M2 36.5h7m2 0h1m3 0h1m2 0h1m2 0h1m2 0h2m1 0h2m1 0h2m2 0h1m1 0h1m1 0h2m1 0h1M2 37.5h1m5 0h1m4 0h1m1 0h1m1 0h2m1 0h3m2 0h4m1 0h2m1 0h2m3 0h1m1 0h1M2 38.5h1m1 0h3m1 0h1m2 0h2m1 0h2m2 0h1m3 0h3m1 0h5m3 0h6m1 0h1M2 39.5h1m1 0h3m1 0h1m1 0h3m1 0h1m1 0h2m1 0h2m1 0h1m1 0h2m5 0h1m1 0h1m1 0h2m1 0h3M2 40.5h1m1 0h3m1 0h1m2 0h1m1 0h3m2 0h6m2 0h2m2 0h2m6 0h1m1 0h1m1 0h1M2 41.5h1m5 0h1m3 0h1m3 0h4m4 0h1m1 0h1m3 0h3m1 0h2m1 0h1m3 0h1M2 42.5h7m2 0h2m2 0h2m2 0h2m3 0h2m2 0h1m2 0h1m2 0h2m1 0h3m1 0h1"/>

        </g>
      </g>

      <!-- Instrucción de escaneo sin link visible -->
      <text x="400" y="484" class="instruction">Escanea para explorar la carta digital</text>
      <text x="400" y="512" class="subtext">Café de especialidad, brunch artesanal y coctelería</text>
      <text x="400" y="546" class="location">Roldanillo, Valle del Cauca</text>
    </g>
  </defs>

  <!-- Fondo Crema -->
  <rect width="800" height="1200" class="bg" />

  <!-- Cara 1 (Superior): Rotada 180° para que al doblarse quede erguida en el reverso -->
  <g transform="rotate(180, 400, 300)">
    <use href="#stand-face" />
  </g>

  <!-- Línea de plegado central (Guía para doblez o corte de exhibidor) -->
  <line x1="25" y1="600" x2="775" y2="600" stroke="#203428" stroke-width="1" stroke-dasharray="6,6" stroke-opacity="0.25" />
  <circle cx="25" cy="600" r="2.5" fill="#203428" opacity="0.3" />
  <circle cx="775" cy="600" r="2.5" fill="#203428" opacity="0.3" />
  <text x="400" y="594" class="fold-text">▲ Línea de Plegado (Fold Here) ▲</text>
  <text x="400" y="612" class="fold-text" transform="rotate(180, 400, 610)">▲ Línea de Plegado (Fold Here) ▲</text>

  <!-- Cara 2 (Inferior): Orientada hacia el frente -->
  <g transform="translate(0, 600)">
    <use href="#stand-face" />
  </g>
</svg>